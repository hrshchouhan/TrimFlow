name: Release Build & Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit & scenario test suite
        shell: cmd
        run: test.bat

      - name: Build production binary
        shell: cmd
        run: build.bat

      - name: Package portable release & SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item TrimFlow.exe dist/TrimFlow.exe -Force
          $zipName = "TrimFlow-$tag-win64-portable.zip"
          Compress-Archive -Path TrimFlow.exe, README.md, LICENSE, ARCHITECTURE.md, CONTRIBUTING.md, CHANGELOG.md -DestinationPath "dist/$zipName" -Force
          $exeHash = (Get-FileHash dist/TrimFlow.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  TrimFlow.exe"
            "$zipHash  $zipName"
          ) | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/TrimFlow.exe
            dist/TrimFlow-${{ github.ref_name }}-win64-portable.zip
            dist/SHA256SUMS.txt
