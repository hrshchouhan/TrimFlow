name: Feature Request / Heuristic Improvement
description: Suggest a new process role rule, CLI flag, or tray improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Opportunity
      description: What problem does this solve, or which application family would benefit?
      placeholder: "Example: Add `--diagnose` flag to print command-line roles for every running process tree..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Behavior
      description: How should TrimFlow behave? Remember that TrimFlow avoids heavy dependencies and stays under 200 KB RAM.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project Constraints Check
      options:
        - label: Uses zero external runtime dependencies (pure Win32 / C++17)
        - label: Can be unit-tested in `tests/heuristics_test.cpp` if it changes process classification
